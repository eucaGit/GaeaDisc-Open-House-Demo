<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G Force · Exchange & Disclosures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ink:#16302a; --ink2:#1f4038; --ink3:#2c5449;
  --gold:#a8854f; --gold2:#c9a86a; --gold-soft:#efe3c8;
  --cream:#f5f0e4; --paper:#fbf8f1; --white:#fffdf8;
  --line:#e2d8c3; --text:#22302c; --muted:#6d756e;
  --ok:#2f6b52; --warn:#a2622a; --bad:#9a3b32;
  --serif:"Cormorant Garamond","Songti SC",Georgia,serif;
  --sans:Inter,-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--text);font:14px/1.5 var(--sans);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--sans);font-weight:700;margin:0;color:var(--ink);letter-spacing:-.015em}
h1{font-size:27px} h2{font-size:20px} h3{font-size:16px}

/* header */
.top{background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:28px;padding:0 24px;height:60px;border-bottom:2px solid var(--gold);flex:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px;letter-spacing:.08em;white-space:nowrap}
.brand i{width:30px;height:30px;border:1px solid var(--gold2);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-style:normal;font-size:16px}
.brand small{font:500 10px var(--sans);letter-spacing:.22em;color:var(--gold2);text-transform:uppercase;margin-left:4px}
.mods{display:flex;gap:4px;height:100%}
.mods button{background:none;border:0;color:#cfd8d1;padding:0 16px;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500;white-space:nowrap}
.mods button.on{color:var(--gold2);border-color:var(--gold2)}
.role{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#b9c5bd;white-space:nowrap}
.seg{display:flex;border:1px solid var(--ink3);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:#cfd8d1;padding:6px 12px;font-size:12px}
.seg button.on{background:var(--gold);color:#fff}

/* shared */
.sub{background:var(--paper);border-bottom:1px solid var(--line);padding:0 24px;display:flex;gap:6px;align-items:center;flex:none;overflow-x:auto}
.sub button{background:none;border:0;padding:13px 12px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.sub button.on{color:var(--ink);border-color:var(--gold)}
.sub .who{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:16px}
.btn{background:var(--ink);color:var(--cream);border:1px solid var(--ink);border-radius:6px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--ink2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:var(--white);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:#7a5c26;white-space:nowrap}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--gold);margin-right:4px} .sdot.on{background:var(--bad);border-color:var(--bad)}
.tag.g{background:#dfeae2;color:var(--ok)} .tag.d{background:var(--ink);color:var(--gold2)} .tag.r{background:#f3dfda;color:var(--bad)} .tag.n{background:#ece7da;color:var(--muted)}
.card{background:var(--white);border:1px solid var(--line);border-radius:10px}
.muted{color:var(--muted)} .small{font-size:12px} .right{text-align:right}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.page{flex:1;overflow:auto;padding:28px 24px 60px}
.wrap{max-width:1120px;margin:0 auto}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;background:#f1eadb;font-weight:600}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--text);width:100%}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:500}
label.f>*{margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.note{background:#faf3e1;border:1px solid #e6d3a6;border-radius:8px;padding:10px 12px;font-size:13px;color:#6b5324}
.switch{position:relative;width:38px;height:22px;border-radius:999px;background:#cfc6b2;border:0;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch.on{background:var(--ok)} .switch.on::after{left:19px}

/* map */
#mapview{flex:1;display:flex;min-height:0}
#map{flex:1;min-width:0;background:#e9e4d6}
.leaflet-tile-pane{filter:grayscale(.55) sepia(.3) brightness(1.03)}
#panel{width:400px;flex:none;background:var(--paper);border-left:1px solid var(--line);overflow:auto;padding:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--gold2);border-color:var(--ink)}
.opp{padding:12px 14px;margin-bottom:10px;cursor:pointer;display:block;width:100%;text-align:left}
.opp:hover{border-color:var(--gold)}
.opp b{font-size:15px;color:var(--ink);font-weight:700}
.amt{font-size:19px;font-weight:700;letter-spacing:-.01em}
.amt.earn{color:var(--ok)} .amt.pay{color:var(--gold)}
.pin{display:flex;align-items:center;gap:5px;padding:4px 9px 4px 6px;border-radius:999px;font:600 12px var(--sans);white-space:nowrap;box-shadow:0 2px 8px rgba(22,48,42,.3);border:1.5px solid #fff;transform:translate(-50%,-100%);position:absolute}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:inherit}
.pin svg{width:14px;height:14px;flex:none}
.pin.pay{background:var(--ok);color:#fff;border-top-color:var(--ok)} .pin.pay::after{border-top-color:var(--ok)}
.pin.bid{background:var(--gold);color:#fff} .pin.bid::after{border-top-color:var(--gold)}
.pin.learn{background:var(--white);color:var(--ink);border-color:var(--gold)} .pin.learn::after{border-top-color:var(--gold)}
.pin.mine{background:var(--ink);color:var(--gold2)} .pin.mine::after{border-top-color:var(--ink)}
.pin.idle{background:#d9d2c1;color:#5d655f} .pin.idle::after{border-top-color:#d9d2c1}
.pin.sel{outline:3px solid var(--gold2);z-index:999}
.legend{position:absolute;left:14px;bottom:22px;z-index:500;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;display:grid;gap:6px}
.legend span{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:12px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:500}
.esc{display:flex;align-items:flex-end;gap:3px;height:46px;margin:8px 0 4px}
.esc i{flex:1;background:#e5dcc6;border-radius:2px 2px 0 0}
.esc i.past{background:var(--gold2)} .esc i.now{background:var(--ok)}
.bidrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--gold2);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}

/* disclosures */
.pkgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}
.pkg{padding:0;overflow:hidden;cursor:pointer;text-align:left;display:block;width:100%}
.pkg:hover{border-color:var(--gold)}
.pkg .ph{height:96px;background:linear-gradient(135deg,var(--ink),var(--ink3));display:flex;align-items:flex-end;padding:12px 16px;color:var(--gold2);font-weight:700;font-size:18px}
.pkg .bd{padding:14px 16px}
.bar{height:6px;border-radius:3px;background:#e9e1cf;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--gold)}
.drop{border:1.5px dashed var(--gold2);border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:#fdfaf2;margin:16px 0}
.drop.over{background:var(--gold-soft);border-color:var(--gold)}
.file{display:flex;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.thumb{width:40px;height:52px;border:1px solid var(--line);border-radius:3px;background:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--bad);flex:none}
.file .nm{font-weight:600;color:var(--ink);word-break:break-word}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;flex:none;margin-top:1px}
.ic.ok{background:var(--ok)} .ic.no{background:var(--bad)} .ic.wa{background:var(--warn)}
.steps{display:grid;gap:8px;margin:14px 0}
.step{display:flex;gap:10px;align-items:center;color:var(--muted)}
.step.done{color:var(--ok)} .step.run{color:var(--ink);font-weight:600}
.spin{width:14px;height:14px;border:2px solid var(--gold-soft);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(22,48,42,.55);display:grid;place-items:center;z-index:2000;padding:16px}
.modal{background:var(--paper);border-radius:12px;border-top:3px solid var(--gold);width:min(560px,100%);max-height:90vh;overflow:auto;padding:24px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:999px;border:1px solid var(--gold);z-index:3000;font-size:13px}
.proto{background:var(--gold-soft);color:#6b5324;font-size:12px;text-align:center;padding:4px;flex:none}
@media (max-width:860px){
  #mapview{flex-direction:column} #panel{width:auto;border-left:0;border-top:1px solid var(--line);max-height:55%}
  .top{gap:8px 10px;padding:8px 12px 0;height:auto;flex-wrap:wrap}.mods{order:3;width:100%;height:40px}.mods button{padding:0 10px}.role{font-size:0;gap:0}.brand small{display:none}
  .legend{display:none}#map{min-height:260px}
  .grid2,.grid3{grid-template-columns:1fr}
}

/* G Force shell */
.gtop{height:52px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 20px}
.glogo{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;white-space:nowrap;width:192px}
.glogo b{color:var(--gold);font-weight:600}
.glogo i{width:14px;height:22px;border-radius:50%;background:radial-gradient(ellipse at 50% 60%,var(--gold2),var(--gold))}
.gnav{display:flex;gap:4px;flex:1;justify-content:center;overflow:hidden}
.gnav span{padding:7px 12px;border-radius:7px;font-weight:500;white-space:nowrap;color:var(--text)}

.shell{flex:1;display:flex;min-height:0}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.side{width:204px;flex:none;background:var(--cream);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 8px 14px;overflow:auto}
.gaea{text-align:center;font:700 20px var(--sans);letter-spacing:.12em;color:var(--ink);padding-bottom:18px;margin:0 8px 16px;border-bottom:1px solid var(--line)}
.gaea small{display:block;font:500 9px var(--sans);letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.gaea em{display:block;font:600 10px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--ink);margin-top:14px}
.side .lbl{font-size:10px;letter-spacing:.24em;color:var(--muted);padding:4px 10px 8px;text-transform:uppercase}
.mods{flex-direction:column;height:auto;gap:2px}
.mods button{color:var(--text);text-align:left;padding:9px 12px;border:0;border-radius:7px;margin:0;font-weight:500}
.mods button.on{background:#ebe2cd;color:var(--gold);font-weight:600;border:0}
.mods button.ext{color:#8c938a}
.side .role{margin:auto 0 0;flex-direction:column;align-items:stretch;gap:8px;color:var(--muted);padding:12px 6px 0;border-top:1px solid var(--line)}
.side .seg{border-color:var(--line)} .side .seg button{color:var(--muted);flex:1;padding:6px 4px}
.side .seg button.on{background:var(--ink);color:var(--gold2)}
.sub{background:var(--cream)}
.split{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:13px}
.split .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700;color:var(--ink)}
@media (max-width:860px){
  .gnav{display:none}.glogo{width:auto;flex:1}
  .shell{flex-direction:column}
  .side{width:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:8px 10px;gap:6px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .gaea,.side .lbl,.mods button.ext{display:none}
  .mods{flex-direction:row;order:0;width:auto;height:auto}
  .side .role{margin:0 0 0 auto;border:0;padding:0;font-size:0;flex-direction:row}
}
</style>
</head>

     {name:'Transfer Disclosure Statement (TDS).pdf',pages:3,size:412e3,date:'Nov 6'},

const DOCS=[
 {k:'TDS',n:'Transfer Disclosure Statement (TDS)',re:/tds|transfer disclosure/i,sign:['Seller','Listing agent']},
 {k:'SPQ',n:'Seller Property Questionnaire (SPQ)',re:/spq|seller property q/i,sign:['Seller']},
 {k:'NHD',n:'Natural Hazard Disclosure (NHD)',re:/nhd|natural hazard/i,sign:['Seller']},
 {k:'AVID',n:'Agent Visual Inspection Disclosure (AVID)',re:/avid|visual inspection/i,sign:['Listing agent']},
 {k:'INSP',n:'Home inspection report',re:/home inspection|property inspection/i},
 {k:'PEST',n:'Pest / termite inspection',re:/pest|termite/i},
 {k:'PRELIM',n:'Preliminary title report',re:/prelim|title report/i},
 {k:'LEAD',n:'Lead-based paint disclosure',re:/lead/i,pre78:true,sign:['Seller','Listing agent']}
];
const classify=name=>(DOCS.find(d=>d.re.test(name))||{}).k||null;
const fee=o=>o.dir==='pay'?Math.min(o.cap,o.base+o.step*Math.floor(o.hrs/o.every)):o.base;
const me=()=>PERSONA[S.role].name;
const isMine=o=>S.role==='lister'&&o.mine;
const myApp=o=>o.apps.find(a=>a.you===S.role);
const DIR={pay:{t:'Pays host',c:'g'},bid:{t:'Host bids',c:''},learn:{t:'Paid shadowing',c:'n'}};

/* ---------- map ---------- */
let map,layer;
function initMap(){
  if(map||!window.L)return;
  map=L.map('map',{zoomControl:true,attributionControl:true}).setView([37.415,-122.13],11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);
  layer=L.layerGroup().addTo(map);
}
function visibleOpps(){
  return S.opps.filter(o=>{
    if(S.filter==='openhouse'||S.filter==='showing')return o.type===S.filter&&o.status==='open';
    if(S.filter==='pay'||S.filter==='bid'||S.filter==='learn')return o.dir===S.filter&&o.status==='open';
    if(S.filter==='mine')return isMine(o)||myApp(o);
    return true;});
}
function drawPins(){
  if(!map)return;layer.clearLayers();
  visibleOpps().forEach(o=>{
    const cls=o.status!=='open'?'idle':isMine(o)?'mine':o.dir;
    const txt=o.status!=='open'?'Filled':o.dir==='pay'?'+'+money(fee(o)):o.dir==='bid'?'Bid '+money(topBid(o)):'Learn '+money(o.base);
    const ic=o.dir==='learn'?ICON.cap:o.type==='showing'?ICON.key:ICON.house;
    L.marker([o.lat,o.lng],{icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="pin ${cls} ${S.sel===o.id?'sel':''}">${ic}${txt}</div>`}),zIndexOffset:S.sel===o.id?1000:0})
     .on('click',()=>{S.sel=o.id;render()}).addTo(layer);
  });
  if(S.role==='lister')S.listings.filter(l=>!S.opps.some(o=>o.addr===l.addr&&o.status==='open')).forEach(l=>{
    L.marker([l.lat,l.lng],{icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="pin idle">${ICON.house}My listing</div>`})}).on('click',()=>{S.exTab='listings';render()}).addTo(layer);
  });
}
const topBid=o=>Math.max(o.base,...o.apps.map(a=>a.amount||0));

/* ---------- render ---------- */
function render(){
  const nav=[['','Market Trends'],['','My Listings'],['','Marketing Studio'],['','Seller'],['exchange','Open House Exchange'],['disc','Disclosures']];
  $('#mods').innerHTML=nav.map(([k,t])=>k?`<button data-a="mod" data-v="${k}" class="${S.mod===k?'on':''}">${t}</button>`:`<button class="ext" data-a="toast" data-v="${t} — existing G Force page">${t}</button>`).join('');
  $('#meav').textContent=initials(me());
  $('#roleseg').innerHTML=[['lister','Listing agent'],['host','Host agent']].map(([k,t])=>`<button data-a="role" data-v="${k}" class="${S.role===k?'on':''}">${t}</button>`).join('');
  const showMap=S.mod==='exchange'&&S.exTab==='map';
  $('#mapview').style.display=showMap?'flex':'none';
  $('#page').style.display=showMap?'none':'block';
  if(S.mod==='exchange'){
    const tabs=[['map','Map'],['listings','My listings'],['gigs','My gigs & payouts']];
    $('#sub').innerHTML=tabs.map(([k,t])=>`<button data-a="extab" data-v="${k}" class="${S.exTab===k?'on':''}">${t}</button>`).join('')+
      `<span class="who">${esc(me())} · ${PERSONA[S.role].label}${S.role==='host'?(S.verified?' · <span class="tag g">Verified</span>':' · <span class="tag r">Not verified</span>'):''}</span>`;
    if(showMap){initMap();setTimeout(()=>map&&map.invalidateSize(),0);drawPins();renderPanel();renderLegend()}
    else $('#page').innerHTML=S.exTab==='listings'?viewListings():viewGigs();
  }else{
    const p=S.pkgs.find(p=>p.id===S.pkg);
    $('#sub').innerHTML=p?`<button data-a="pkg" data-v="">← All packages</button>`+[['files','Files'],['ai','AI review'],['sign','Signing'],['viewers','Viewers'],['activity','Activity'],['settings','Settings']].map(([k,t])=>`<button data-a="pkgtab" data-v="${k}" class="${S.pkgTab===k?'on':''}">${t}</button>`).join('')
      :`<button class="on">Disclosure packages</button><span class="who">${esc(me())}</span>`;
    $('#page').innerHTML=p?viewPkg(p):viewPkgs();
    bindDrop();
  }
}
function renderLegend(){
  $('#legend').innerHTML=`<span><i class="dot" style="background:var(--ok)"></i>Open to host · you get paid</span><span><i class="dot" style="background:var(--gold)"></i>Bidding · hosts pay to host</span><span><i class="dot" style="background:#fff;border:1.5px solid var(--gold)"></i>Paid shadowing</span>${S.role==='lister'?'<span><i class="dot" style="background:var(--ink)"></i>My posted opportunities</span>':''}<span><i class="dot" style="background:#d9d2c1"></i>Filled / not posted</span>`;
}
function renderPanel(){
  const o=S.opps.find(o=>o.id===S.sel);
  if(o){$('#panel').innerHTML=oppDetail(o);return}
  const f=[['all','All'],['openhouse','Open houses'],['showing','Showings'],['pay','Paying'],['bid','Bidding'],['learn','Shadowing'],['mine','Mine']];
  const list=visibleOpps();
  $('#panel').innerHTML=`<div class="eyebrow">Open House Exchange</div><h2>Opportunities near you</h2>
   <div class="chips">${f.map(([k,t])=>`<button class="chip ${S.filter===k?'on':''}" data-a="filter" data-v="${k}">${t}</button>`).join('')}</div>
   ${list.map(o=>`<button class="card opp" data-a="sel" data-v="${o.id}">
      <div class="row" style="flex-wrap:nowrap"><div style="min-width:0"><b>${esc(o.addr)}</b><div class="muted small">${o.city} · ${money(o.price)} · ${o.beds} bd</div></div><span class="sp"></span>${amount(o)}</div>
      <div class="row" style="margin-top:8px;gap:6px"><span class="tag d">${o.type==='openhouse'?'Open house':'Showing'}</span>${o.status==='open'?`<span class="tag ${DIR[o.dir].c}">${DIR[o.dir].t}</span>`:'<span class="tag n">Filled</span>'}${o.first?'<span class="tag r">First weekend</span>':''}${isMine(o)?'<span class="tag n">Yours</span>':''}<span class="sp"></span><span class="muted small">${o.date}</span></div>
    </button>`).join('')||'<p class="muted">Nothing matches this filter.</p>'}`;
}
function amount(o){
  if(o.status!=='open')return '<span class="muted small">Assigned</span>';
  if(o.dir==='pay')return `<span class="amt earn">+${money(fee(o))}</span>`;
  if(o.dir==='bid')return `<span class="amt pay">${money(topBid(o))}</span>`;
  return `<span class="amt pay">${money(o.base)}</span>`;
}
function oppDetail(o){
  const mine=isMine(o),app=myApp(o),open=o.status==='open';
  let rule='';
  if(o.dir==='pay'){
    const n=Math.round((o.cap-o.base)/o.step)+1,cur=Math.min(n-1,Math.floor(o.hrs/o.every));
    const left=o.every-(o.hrs%o.every);
    rule=`<div class="card" style="padding:14px;margin:14px 0"><div class="row"><b>Auto-raise rule</b><span class="sp"></span><span class="muted small">posted ${o.hrs}h ago</span></div>
      <div class="esc">${Array.from({length:n},(_,i)=>`<i class="${i<cur?'past':i===cur?'now':''}" style="height:${30+70*i/(n-1||1)}%"></i>`).join('')}</div>
      <div class="small muted">Starts at ${money(o.base)}, +${money(o.step)} every ${o.every}h with no taker, capped at ${money(o.cap)}. ${fee(o)<o.cap&&open?`Next raise in ${left}h.`:open?'At cap.':''}</div>
      ${open?`<button class="btn ghost sm" style="margin-top:8px" data-a="tick" data-v="${o.id}">Demo: skip ahead ${o.every}h</button>`:''}</div>`;
  }else if(o.dir==='bid'){
    rule=`<div class="note" style="margin:14px 0">High-demand open house. Hosts bid what they will pay for the slot (minimum ${money(o.base)}). ${open?`Bidding closes in ${Math.max(0,24-o.hrs)}h. The highest bid wins automatically, unless the listing agent picks someone sooner.`:'Bidding is closed.'}${open&&o.apps.length?` <button class="btn ghost sm" data-a="closebid" data-v="${o.id}">Demo: skip to close</button>`:''}</div>`;
  }else{
    rule=`<div class="note" style="margin:14px 0">Paid shadowing: ${esc(o.lister)} is a verified mentor offering a seat at this ${o.type==='openhouse'?'open house':'showing'}. A learner pays ${money(o.base)} to come along; the mentor approves who joins.</div>`;
  }
  const apps=[...o.apps].sort((a,b)=>(b.amount||0)-(a.amount||0));
  const appsHtml=apps.length?apps.map(a=>`<div class="bidrow"><span class="av">${initials(a.who)}</span><div style="min-width:0"><b>${esc(a.who)}${a.you===S.role?' (you)':''}</b><div class="muted small">★ ${a.rating} · ${a.jobs} completed</div></div><span class="sp"></span>
      ${o.dir==='bid'?`<b class="num">${money(a.amount)}</b>`:''}
      ${mine&&open?`<button class="btn sm gold" data-a="approve" data-v="${o.id}|${esc(a.who)}">Approve</button>`:o.assignee===a.who?'<span class="tag g">Approved</span>':''}</div>`).join('')
    :'<p class="muted small">No one has applied yet.</p>';
  const accOut=o.access&&(o.autoAccess||o.accessSent);
  const accHost=accOut?`<div class="card" style="padding:14px;margin-top:8px"><b>Access details</b><div class="muted small" style="margin-top:4px">${esc(o.access)}</div></div>`:'<div class="small muted" style="margin-top:8px">The listing agent will email access details to you directly.</div>';
  const accMine=o.status!=='assigned'?'':accOut?`<div class="small muted" style="margin-top:8px">Access details were emailed to ${esc(o.assignee)}.</div>`:`<button class="btn ghost sm" style="margin-top:8px" data-a="sendaccess" data-v="${o.id}">Send access details</button>`;
  let cta='';
  if(mine){
    cta=open?'':`<button class="btn gold" style="width:100%" data-a="complete" data-v="${o.id}">Mark completed · release payment</button>
      <div class="row" style="margin-top:8px"><button class="btn ghost sm" data-a="cancel" data-v="${o.id}">Cancel booking</button><button class="btn ghost sm" data-a="noshow" data-v="${o.id}">Report no-show</button></div>${accMine}`;
    if(o.status==='done')cta='<div class="note">Completed. Automatic payment is coming soon.</div>';
  }else if(!open){
    cta=o.assignee===me()?'<div class="note">You are confirmed for this one. Payout releases after the listing agent marks it completed. Buyers you meet there are your clients. Tell every visitor that you are not the listing agent.</div>'+accHost+'<button class="btn ghost" style="width:100%;margin-top:8px" data-a="toast" data-v="Opens Add client — the visitor is saved to your G Force Clients">Add a visitor to my clients</button><button class="btn ghost sm" style="margin-top:8px" data-a="cancel" data-v="'+o.id+'">Cancel my commitment</button>':'<div class="note">This opportunity has been filled.</div>';
  }else if(app){
    cta=`<div class="note">Application sent${app.amount?` · your bid ${money(app.amount)}`:''}. Waiting for ${esc(o.lister)} to approve. <button class="btn ghost sm" data-a="withdraw" data-v="${o.id}">Withdraw</button></div>`;
  }else if(o.dir==='bid'){
    cta=`<div class="row" style="flex-wrap:nowrap"><input type="number" id="bidamt" min="${o.base}" step="5" value="${topBid(o)+10}" aria-label="Your bid in dollars"><button class="btn gold" data-a="apply" data-v="${o.id}">Place bid</button></div>`;
  }else{
    cta=`<button class="btn gold" style="width:100%" data-a="apply" data-v="${o.id}">${o.dir==='pay'?`Offer to host · you receive ${money2(fee(o)-gfee(fee(o)))}`:`Request to shadow · pay ${money(o.base)}`}</button>`;
  }
  const P=o.dir==='pay'?fee(o):o.dir==='bid'?topBid(o):o.base;
  const payer=o.dir==='pay'?'Listing agent':o.dir==='bid'?'Winning host':'Learner',payee=o.dir==='pay'?'Host':o.dir==='bid'?'Listing agent':'Mentor';
  return `<button class="btn ghost sm" data-a="sel" data-v="">← Back to list</button>
    <div style="margin-top:14px" class="row"><span class="tag d">${o.type==='openhouse'?'Open house':'Showing'}</span><span class="tag ${DIR[o.dir].c}">${DIR[o.dir].t}</span>${o.first?'<span class="tag r">First weekend</span>':''}${o.dir==='learn'?'<span class="tag g">Verified mentor</span>':''}</div>
    <h2 style="margin-top:8px">${esc(o.addr)}</h2><div class="muted">${o.city} · ${money(o.price)} · ${o.beds} bd / ${o.baths} ba</div>
    <dl class="kv"><dt>When</dt><dd>${o.date} · ${o.time}</dd><dt>${o.dir==='learn'?'Mentor':'Listing agent'}</dt><dd>${esc(o.lister)}${mine?' (you)':''}</dd>
      <dt>${o.dir==='pay'?'Current fee to host':o.dir==='bid'?'Top bid':'Shadowing fee'}</dt><dd>${amount(o)}</dd></dl>
    ${rule}
    <div class="card" style="padding:14px;margin:0 0 16px"><b>Where the money goes</b><div class="split" style="margin-top:8px">
      <span>${payer} pays</span><span class="num">${money2(P)}</span>
      <span class="muted">G Force fee · $${FEE.flat} + ${FEE.pct*100}%</span><span class="num muted">−${money2(gfee(P))}</span>
      <span class="tot">${payee} receives</span><span class="num tot">${money2(P-gfee(P))}</span></div>
      <div class="small muted" style="margin-top:8px">Charged only after the job is marked completed. Card processing is included in the fee.</div></div>
    <h3>${o.dir==='bid'?'Bids':'Applicants'} <span class="muted small" style="font-family:var(--sans)">(${apps.length})</span></h3>
    ${appsHtml}<div style="margin-top:16px">${cta}</div>`;
}

function viewGigs(){

/* ---------- disclosures ---------- */
function checklist(p){
  return DOCS.filter(d=>!d.pre78||p.built<1978).map(d=>({...d,file:p.files.find(f=>classify(f.name)===d.k)}));
}
function viewPkgs(){
  return `<div class="wrap"><div class="row"><div><div class="eyebrow">Disclosures</div><h1>Disclosure packages</h1></div><span class="sp"></span><button class="btn gold" data-a="newpkg">New package</button></div>
   <p class="muted small" style="margin-top:10px">Disclosure packages are included with your G Force membership.</p>
   <div class="pkgs">${S.pkgs.map(p=>{const c=checklist(p),n=c.filter(x=>x.file).length;return `<button class="card pkg" data-a="pkg" data-v="${p.id}"><div class="ph">${esc(p.addr)}</div><div class="bd">
     <div class="muted small">${esc(p.city)}</div><div class="row" style="margin-top:8px"><span class="tag ${n===c.length?'g':''}">${n}/${c.length} required docs</span><span class="tag ${p.signed?'g':'n'}">${p.signed?'Signed':'Not signed'}</span><span class="sp"></span><span class="muted small">${p.files.length} files · ${p.viewers.length} viewers</span></div>
     <div class="bar"><i style="width:${100*n/c.length}%"></i></div></div></button>`}).join('')}</div></div>`;
}
function viewPkg(p){
  const head=`<div class="row" style="margin-bottom:18px"><div><div class="eyebrow">Disclosure package</div><h1>${esc(p.addr)}</h1><div class="muted">${esc(p.city)}${p.meta?' · '+esc(p.meta):''}</div></div><span class="sp"></span>
    <button class="btn ghost" data-a="toast" data-v="Download all — zips every file in order">Download all</button><button class="btn" data-a="share">Share package</button></div>`;
  let body='';

function bindDrop(){
  const d=$('#drop');if(!d)return;
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',ev=>addFiles(ev.dataTransfer.files));
  $('#fileinp').addEventListener('change',ev=>addFiles(ev.target.files));
}
function addFiles(list){
  const p=S.pkgs.find(p=>p.id===S.pkg);let n=0,skip=0;
  [...list].forEach(f=>{if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){skip++;return}
    p.files.push({name:f.name,size:f.size,date:'Today',url:URL.createObjectURL(f)});n++});
  if(n)p.activity.unshift(['Today',`You uploaded ${n} file${n>1?'s':''}`]);
  toast(n?`${n} file${n>1?'s':''} added${skip?` · ${skip} skipped (PDF only)`:''}`:'Only PDF files are accepted');
  render();
}

/* ---------- standing: strikes, suspension, appeal, revocation ---------- */
const STAND={good:['g','Good standing'],suspended:['r','Suspended'],probation:['','Reinstated · probation'],revoked:['r','Revoked']};
const blocked=()=>['suspended','revoked'].includes(S.stand[S.role].st);
function strike(role,k){const s=S.stand[role];if(s.st==='good'){s.n+=k;if(s.n>=3)s.st='suspended'}else if(s.st==='probation'){s.pn+=k;if(s.pn>=2)s.st='revoked'}}
const isLate=o=>(+(o.date.match(/\d+/)||[99])[0])-10<=1; /* demo clock: today is Nov 10 */
function standCard(){
  const s=S.stand[S.role],[c,t]=STAND[s.st];
  const dots=(n,of)=>Array.from({length:of},(_,i)=>`<i class="sdot ${i<n?'on':''}"></i>`).join('');
  const body=s.st==='good'?`<span>${dots(s.n,3)}</span><span class="muted small">${Math.min(s.n,3)} of 3 strikes in the last 6 months</span>`
   :s.st==='suspended'?`<span class="muted small">3 strikes in 6 months. Posting, applying and bidding are paused until an appeal is approved.</span><button class="btn gold sm" data-a="appeal">Appeal</button>`
   :s.st==='probation'?`<span>${dots(s.pn,2)}</span><span class="muted small">${Math.min(s.pn,2)} of 2 strikes since reinstatement. The second one revokes access.</span>`
   :`<span class="muted small">Access to the exchange has been permanently removed.</span>`;
  return `<div class="card row" style="padding:14px 16px;margin-top:14px"><b>Account standing</b><span class="tag ${c}">${t}</span>${body}<span class="sp"></span><button class="btn ghost sm" data-a="policy">Cancellation policy</button></div>`;
}

    mod(){S.mod=v},role(){S.role=v;S.sel=null},extab(){S.exTab=v},filter(){S.filter=v},

    soon(){modal(`<div class="eyebrow">Coming soon</div><h2>${esc(v)}</h2><p class="muted" style="margin-top:10px">This part is not connected yet. Contact administration for more details.</p><div class="row"><span class="sp"></span><button class="btn" data-a="closebtn">Close</button></div>`);return false},
    sendaccess(){const o=S.opps.find(o=>o.id==v);if(!o.access){const a=prompt('Access details to send (lockbox code, entry notes)');if(!a)return false;o.access=a}o.accessSent=true;toast('Access details emailed to '+o.assignee)},

      toast(S.stand[S.role].st==='suspended'?'Cancelled · third strike, account suspended':S.stand[S.role].st==='revoked'?'Cancelled · access revoked':late?'Cancelled · 1 strike added':'Cancelled · no strike')},
    noshow(){const o=S.opps.find(o=>o.id==v),who=o.assignee;o.apps=o.apps.filter(x=>x.who!==who);o.status='open';o.assignee=null;if(who===PERSONA.host.name)strike('host',2);toast('No-show recorded · 2 strikes for '+who+'. No payment collected.')},
    appeal(){modal(`<div class="eyebrow">Appeal</div><h2>Appeal submitted</h2><p class="muted">Gaea reviews appeals within 2 business days. If reinstated, your account is on probation: 2 further strikes revoke access permanently.</p><div class="row"><span class="sp"></span><button class="btn ghost" data-a="closebtn">Close</button><button class="btn gold" data-a="reinstate">Demo: appeal approved</button></div>`);return false},
    reinstate(){const s=S.stand[S.role];s.st='probation';s.pn=0;modal('');toast('Reinstated on probation')},

      modal('');toast('Published to the exchange map')},
    verify(){verifyModal();return false},
    doverify(){S.verified=true;modal('');toast('Verified');if(v){S.sel=+v}},
    closebtn(){modal('');return false},
    toast(){toast(v);return false},
    pkg(){S.pkg=v||null;S.pkgTab='files';S.signRun=0},pkgtab(){S.pkgTab=v},
    newpkg(){const addr=prompt('Property address for the new package');if(!addr)return false;const id='p'+Date.now();S.pkgs.push({id,addr,city:'',meta:'',built:1990,signed:false,ai:true,aiNote:'',files:[],viewers:[],activity:[['Today','You created this package']]});S.pkg=id;S.pkgTab='files'},
    pick(){$('#fileinp').click();return false},
    open(){const f=p.files[v];f.url?window.open(f.url,'_blank'):toast('Sample file — upload a PDF to preview it');return false},
    summary(){const f=p.files[v];modal(`<div class="eyebrow">AI summary</div><h2>${esc(f.name)}</h2><p class="muted" style="margin-top:10px">Sample output. In production the G Force AI reads the document and returns key findings, repair costs, and anything a buyer should ask about, with page references.</p><div class="row"><span class="sp"></span><button class="btn" data-a="closebtn">Close</button></div>`);return false},
    rename(){const f=p.files[v];const n=prompt('Rename file',f.name);if(!n)return false;f.name=n},
    mv(){const [i,d]=v.split('|').map(Number);const [f]=p.files.splice(i,1);p.files.splice(i+d,0,f)},
    del(){if(!confirm('Remove “'+p.files[v].name+'” from this package?'))return false;p.files.splice(v,1)},
    autosort(){const ord=DOCS.map(d=>d.k);p.files.sort((a,b)=>{const x=ord.indexOf(classify(a.name)),y=ord.indexOf(classify(b.name));return (x<0?99:x)-(y<0?99:y)});toast('Sorted into standard disclosure order')},
    share(){modal(`<div class="eyebrow">Share package</div><h2>${esc(p.addr)}</h2><label class="f" style="margin-top:14px">Private link<input type="text" readonly value="https://geta.house/d/${p.id}-sample"></label><p class="muted small">Viewers sign in with G Force before opening, so every view and download is tracked.</p><div class="row"><span class="sp"></span><button class="btn" data-a="closebtn">Done</button></div>`);return false},
    runsign(){S.signRun=1;const tick=()=>{if(S.signRun<4){S.signRun++;if(S.mod==='disc'&&S.pkgTab==='sign')render();if(S.signRun<4)setTimeout(tick,1100)}};setTimeout(tick,1100)},
    send(){p.signed=true;p.activity.unshift(['Today','Package sent to '+p.parties.length+' signers']);toast('Sent to '+p.parties.length+' signers (simulated)')},
    addparty(){const name=prompt('Signer name');if(!name)return false;const role=prompt('Role (Seller, Listing agent, Buyer…)','Seller')||'Seller';const email=prompt('Email')||'';p.parties.push({name,role,email})},
    delparty(){p.parties.splice(v,1)},
    aitoggle(){p.ai=!p.ai},savenote(){p.aiNote=$('#ainote').value;toast('Instructions saved')}
  };
  if(A[a]&&A[a]()!==false)render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal('')});
render();
</script>
</body>
